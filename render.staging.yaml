services:
  - type: web
    name: waschplan-staging-test7
    env: node
    plan: free
    branch: codex/staging
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: APP_RELEASE
        value: staging-v0.3.0-test.7
      - key: DB_PATH
        value: /tmp/waschplan-staging.sqlite
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_IDLE_MINUTES
        value: 30
      - key: SEED_ADMIN_NAME
        value: staging-admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: HOUSE_CODE
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: BACKUP_ENABLED
        value: false
      - key: AUTO_BACKUP
        value: false
      - key: EMAIL_ENABLED
        value: false
      - key: PUSH_ENABLED
        value: false
