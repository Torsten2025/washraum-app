services:
  - type: web
    name: waschzeit-agent-test
    env: node
    plan: free
    region: frankfurt
    branch: codex/agent-test
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: agent-test
      - key: APP_RELEASE
        value: agent-v0.3.0-test.8
      - key: DB_PATH
        value: /tmp/waschzeit-agent-test.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_IDLE_MINUTES
        value: 30
      - key: SEED_ADMIN_NAME
        value: agent-test-admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_FORCE_PASSWORD_RESET
        value: false
      - key: HOUSE_CODE
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://waschzeit-agent-test.onrender.com
      - key: BACKUP_ENABLED
        value: false
      - key: AUTO_BACKUP
        value: false
      - key: EMAIL_ENABLED
        value: false
      - key: PUSH_ENABLED
        value: false
