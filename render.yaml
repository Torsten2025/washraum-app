services:
  - type: web
    name: waschplan-app
    env: node
    plan: starter
    branch: master
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DB_PATH
        value: /var/data/washraum.sqlite
      - key: WEB_CONCURRENCY
        value: 1
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_IDLE_MINUTES
        value: 30
      - key: SEED_ADMIN_NAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: HOUSE_CODE
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AUTO_BACKUP
        value: false
      - key: BACKUP_ENABLED
        value: false
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: EMAIL_ENABLED
        value: false
      - key: PRODUCTION_EMAIL_APPROVED
        value: false
      - key: PUSH_ENABLED
        value: false
      - key: PRODUCTION_PUSH_APPROVED
        value: false
    disk:
      name: washraum-data
      mountPath: /var/data
      sizeGB: 1
