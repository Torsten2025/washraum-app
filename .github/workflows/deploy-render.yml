name: Verify and deploy to Render

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact tested production candidate commit
        required: true
        type: string
      backup_proof:
        description: Signed proof token emitted by the production backup bootstrap
        required: true
        type: string
      parallel_actions:
        description: Must remain none after the final Render preflight
        required: true
        type: choice
        options:
          - none
      render_auto_deploy:
        description: Must remain off so the master push cannot trigger a second deploy
        required: true
        type: choice
        options:
          - off

permissions:
  contents: write

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Bind workflow to the tested candidate
        env:
          EXPECTED_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::Production workflow must run from master."
            exit 1
          fi
          if [ "$EXPECTED_CANDIDATE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::The workflow ref does not match the tested candidate."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for mandatory E2E tests
        run: npx playwright-core install --with-deps chromium

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify application
        run: npm run check

      - name: Run mandatory browser and visual tests
        env:
          E2E_SCREENSHOT_DIR: artifacts/e2e-screenshots
        run: npm run test:e2e

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ github.sha }}
          path: artifacts/e2e-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PRODUCTION_RELEASE_PROOF_KEY: ${{ secrets.PRODUCTION_RELEASE_PROOF_KEY }}
          PRODUCTION_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PRODUCTION_PARALLEL_ACTIONS: ${{ inputs.parallel_actions }}
          PRODUCTION_AUTO_DEPLOY: ${{ inputs.render_auto_deploy }}
          PRODUCTION_BACKUP_PROOF: ${{ inputs.backup_proof }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/trigger-production-deploy.js

      - name: Verify deployed commit
        env:
          APP_URL: https://washraum-app.onrender.com
        run: |
          health=""
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$APP_URL/api/health" || true)"
            if printf '%s' "$health" | grep --fixed-strings --quiet "$GITHUB_SHA"; then
              echo "Render is live on $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for Render deploy ($attempt/60)..."
            sleep 10
          done

          echo "Last health response: ${health:-unavailable}"
          echo "::error::Render did not report commit $GITHUB_SHA as live."
          exit 1
